<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Staff Login — Dots Catering</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="login-body">
    <main class="login-card">
        <h1>🍽️ Dots Staff</h1>
        <p class="lede">Sign in to run the books, the crew, and the calendar.</p>
        {% if error %}<div class="banner banner-warn" role="alert">{{ error }}</div>{% endif %}
        <form method="post" action="/admin/login" class="login-form">
            <label>Password
                <input type="password" name="password" autofocus autocomplete="current-password" required placeholder="Your staff password" />
            </label>
            <button type="submit" class="btn btn-big">Sign In</button>
        </form>
        <p class="muted"><a href="/">← Back to the site</a></p>
    </main>
    <script>document.querySelector('input[name=password]').focus();</script>
</body>
</html>
